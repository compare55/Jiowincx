<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiowin - Aviator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="aviator-luxury.css">
</head>
<body>

  <header class="navbar">
    <button class="back-icon" onclick="location.href='index.html'">←</button>
    <div class="logo"><img src="jiowin-logo.svg" alt="Jiowin" style="height:38px;width:auto;vertical-align:middle"> <span>Jiowin</span> · ✈️ Aviator</div>
    <div class="nav-wallet">
      <div class="coin-display">🪙 <span id="navBalance">1000</span></div>
      <button class="nav-btn" onclick="openWallet()">Wallet</button>
    </div>
  </header>

  <main class="page">
    <div class="aviator-container">
      <div class="history-bar" id="historyBar"></div>

      <div class="aviator-screen">
        <canvas id="aviatorCanvas"></canvas>
        <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
        <div class="status-text" id="statusText">Waiting for next round...</div>
      </div>

      <div class="sound-row">
        <button type="button" id="aviatorSoundToggle" class="sound-toggle" aria-pressed="false">🔇 SOUND OFF</button>
      </div>
      <audio id="aviatorFlightAudio" src="aviator-flight-loop.mp3" preload="auto" loop></audio>
      <audio id="aviatorPreflightAudio" src="aviator-preflight.mp3" preload="auto"></audio>
      <audio id="aviatorCrashAudio" src="aviator-crash.mp3" preload="auto"></audio>

      <div class="aviator-controls">
        <div class="bet-section">
          <label>Bet Amount</label>
          <div class="bet-input-group">
            <button onclick="adjustBet(-50)">-</button>
            <input type="number" id="aviatorBet" value="10" min="10" step="10">
            <button onclick="adjustBet(50)">+</button>
          </div>
          <div class="quick-bets">
            <button onclick="setBet(10)">10</button>
            <button onclick="setBet(50)">50</button>
            <button onclick="setBet(100)">100</button>
            <button onclick="setBet(500)">500</button>
          </div>
        </div>

        <button id="aviatorActionBtn" class="aviator-action-btn">PLACE BET</button>

        <div class="auto-cashout">
          <label>Auto Cash Out at</label>
          <input type="number" id="autoCashout" value="2.00" step="0.1" min="1.1">
          <span>x</span>
        </div>
      </div>
    </div>
  </main>

  <div id="walletModal" class="modal hidden">
    <div class="modal-content">
      <h2>💰 My Wallet</h2>
      <div class="wallet-balance">
        <div class="wb-label">Available Coins</div>
        <div class="wb-amount">🪙 <span id="walletBalance">1000</span></div>
      </div>
      <div class="wallet-actions">
        <button class="btn-add" onclick="addCoins()">+ Add Coins</button>
        <button class="btn-withdraw" onclick="withdrawCoins()">↓ Withdraw</button>
      </div>
      <div class="wallet-info"><p>⚠️ Virtual coins only. No real money involved.</p></div>
      <h3 style="margin-top:1.5rem;">Transaction History</h3>
      <div id="txHistory" class="tx-history"></div>
      <button class="modal-close" onclick="closeWallet()">Close</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="aviator.js"></script>
</body>
</html>
