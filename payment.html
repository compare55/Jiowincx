<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit Payment</title><link rel="stylesheet" href="style.css"><style>
body{background:#f4f2fb;color:#201a35}.pay-page{max-width:520px;margin:24px auto;padding:18px}.pay-card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 8px 30px #1a123012}.pay-top{display:flex;align-items:center;gap:12px}.back-link{border:0;background:#f1eff8;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer}.pay-title{font-size:1.5rem;font-weight:800}.method-name{text-align:center;font-size:1.15rem;font-weight:700;margin:22px 0}.qr-placeholder{min-height:210px;border:1px solid #e6e1f0;background:#faf9fe;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#77718e}.qr-placeholder img{display:block;width:100%;max-width:390px;height:auto;object-fit:contain;border-radius:8px;margin:auto}.pay-card label{display:block;margin:14px 0 6px;font-weight:600}.pay-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9d5e6;border-radius:10px;font:inherit}.pay-submit{width:100%;margin-top:18px;background:#5524c7;color:white;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer}.notice{font-size:.86rem;color:#77718e;line-height:1.5}.status{margin-top:12px;padding:10px;border-radius:10px;background:#f6f3ff;color:#514477;display:none}
</style></head><body><main class="pay-page"><section class="pay-card"><div class="pay-top"><button class="back-link" onclick="history.back()" aria-label="Back">‹</button><div class="pay-title">Deposit</div></div><div id="methodName" class="method-name">Payment method</div><div class="qr-placeholder"><img src="phonepe-payment-qr.jpeg" alt="Scan and pay using PhonePe QR code"></div><form id="paymentForm"><label for="amount">Deposit amount (₹)</label><input id="amount" type="number" min="1" max="100000" step="1" required placeholder="Enter amount"><label for="utr">Transaction ID / UTR (after paying)</label><input id="utr" maxlength="80" required placeholder="Enter UTR / transaction reference"><button class="pay-submit" type="submit">Submit payment details</button></form><p class="notice">Admin approval starter: the request is sent to Telegram when the backend and bot credentials are configured. Approval does not verify bank settlement automatically or securely sync this demo wallet.</p><div id="status" class="status" role="status"></div></section></main><script>
const names={'paytm':'Paytm','phonepe':'PhonePe','upi':'UPI','phonepe-p2p':'PhonePe (P2P)','upi-p2p':'UPI (P2P)','paytm-p2p':'Paytm (P2P)','gpay':'Google Pay (P2P)'};const method=new URLSearchParams(location.search).get('method')||'upi';document.getElementById('methodName').textContent=names[method]||'UPI';document.title=(names[method]||'UPI')+' Deposit';document.getElementById('paymentForm').addEventListener('submit',async e=>{e.preventDefault();const amount=document.getElementById('amount').value;const utr=document.getElementById('utr').value.trim();if(!amount||Number(amount)<=0||!utr)return;const status=document.getElementById('status');status.textContent='Sending request to Jiowin admin...';status.style.display='block';
const customerId=localStorage.getItem('jiowinCustomerId')||('J'+Math.random().toString(36).slice(2,12).toUpperCase());localStorage.setItem('jiowinCustomerId',customerId);
try{const r=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'deposit',amount:Number(amount),utr,customerId})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');status.textContent='Request '+d.id+' sent to admin. Keep this page open while waiting for approval.';
const timer=setInterval(async()=>{try{const q=await fetch('/api/requests/'+encodeURIComponent(d.id));const st=await q.json();if(st.status==='APPROVED'||st.status==='REJECTED'){clearInterval(timer);status.textContent=st.status==='APPROVED'?'Admin approved this request. Please contact admin to reconcile your wallet balance.':'Admin rejected this request.';} }catch(e){}},3000);
}catch(err){status.textContent='Could not send request: '+err.message;}});
</script></body></html>
